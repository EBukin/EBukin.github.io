# Renders the Quarto site and publishes it to GitHub Pages.
#
# Live since 2026-09-08: Pages is set to source "GitHub Actions", and every push
# to `main` republishes. `workflow_dispatch` is kept alongside so a publish can
# still be forced from the Actions tab without a commit — useful when only a
# repo setting or an external asset has changed.
name: Publish site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      # The CV PDFs are typeset with Typst (bundled with Quarto) and need
      # Spectral and IBM Plex Sans on disk. No R or Python: the site has no
      # executable code chunks.
      - name: Fetch fonts
        run: bash scripts/fetch-fonts.sh

      - name: Render
        run: quarto render

      # Application CVs (cv/Bukin-cv-JRC-tax-2026.qmd and any like it) are built by the
      # render above but written for one vacancy each, so they are not published.
      # An allowlist rather than a name pattern, so a new one is covered whatever it
      # is called. They cannot be left out of the render instead: a file excluded
      # from `project: render:` is rendered outside the project and loses the
      # shortcodes.
      - name: Keep application CVs off the site
        run: find _site/cv -type f -name '*.pdf' ! -name 'cv-full.pdf' ! -name 'cv-short.pdf' -print -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
