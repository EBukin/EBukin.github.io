  - type: teaching
    period: "2020 — 2024"
    title: "Advanced Econometrics in the Social Sciences"
    place: "MSc · English · JLU Giessen"
    in: [full]
    summary: "The mostly-harmless toolbox for getting from a cause to an effect."
    description: |
      The mostly-harmless toolbox for getting from a cause to an effect. Panel methods,
      instrumental variables, difference-in-differences, and regression discontinuity.

  - type: teaching
    period: "2025 — present"
    title: "AI-assisted coding for economists"
    place: "World Bank Open Learning Campus"
    in: [full]
    summary: "A World Bank course on using AI responsibly in R and Stata workflows, taken by more than 600 staff."
    description: |
      A World Bank course on using AI responsibly in R and Stata workflows, taken by
      more than 600 staff. An accompanying seminar series runs alongside it.
      [worldbank.github.io/ai4coding](https://worldbank.github.io/ai4coding/)

  # ---- projects and software -----------------------------------------------------
  #
  # Neither type is printed in a PDF — no {{< cv >}} call in cv/ asks for one — but
  # they are written here rather than on projects.qmd so that the page is a list of
  # records like every other list on the site, and so that a project can be moved into
  # a CV variant later by adding `in:` and one shortcode call.
  #
  # Neither carries a `period:`: nothing in this file dates a research stream or a
  # package, and an invented range would be worse than no line at all. The row simply
  # opens on its title, and the section label above it carries the accent instead.

  - type: project
    title: "Land reform in Kazakhstan"
    place: "Justus Liebig University Giessen · PhD research"
    summary: "Thirty years of land-allocation reform evaluated across 200 rayon-level units."
    description: |
      Thirty years of land-allocation reform evaluated across 200 rayon-level units.
      Administrative statistics are combined with geospatial measures of land cover,
      climate and vegetation, and with the natural experiment of pasture privatization
      that the thesis itself evaluates.

  - type: project
    title: "Land valuation in Ukraine"
    place: "The World Bank · Ukrainian State Cadaster"
    summary: "Mass valuation of agricultural and urban land in a deliberately data-scarce environment."
    description: |
      Mass valuation of agricultural and urban land in a deliberately data-scarce
      environment. The regression-based method for agricultural land was adopted by the
      State Cadaster; the urban work combines real estate listing data with Cadaster and
      Registry of Rights records, piloted on Lviv.

  - type: project
    title: "GeoPov"
    place: "The World Bank · Global Poverty Department"
    summary: "A departmental programme joining microdata with geospatial data to read spatial income and welfare disparities."
    description: |
