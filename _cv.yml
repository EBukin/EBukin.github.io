cv:

  # ---- profile -----------------------------------------------------------------
  #
  # One paragraph per variant, written to its own length. Nothing else in the CVs is
  # prose about the person.

  - type: profile
    in: [full]
    text: |
      Land and poverty economist with a decade of research and hands-on operational
      experience in Ukrainian land markets, institutions, and valuation. My work combines
      rigorous impact evaluation with the practical business of making land data usable:
      published peer-reviewed research on farmland pricing, rental-market efficiency, and
      land valuation and taxation in Ukraine, and direct technical assistance to the State
      Cadaster — including analysis code adopted as the basis for regression-based
      agricultural land valuation. My current pipeline extends this into urban mass
      valuation (real estate listing data combined with Cadaster and Registry of Rights
      records) and a large-scale impact evaluation of land reform in Kazakhstan. I work
      fluently across survey, administrative, and geospatial data (R, Python, Google Earth
      Engine, PostGIS), and have consulted on the Land Parcel Identification System and
      mass valuation of agricultural land. Alongside my research I have several years'
      experience teaching applied econometrics and impact-evaluation methods and building
      analytical capacity with clients and national statistical offices.

  - type: profile
    in: [short]
    text: |
      Land and poverty economist with a decade of research and operational experience in
      Ukrainian land markets, institutions, and valuation. Peer-reviewed work on farmland
      pricing, rental-market efficiency, and land valuation and taxation; analysis code
      adopted by the Ukrainian State Cadaster as the basis for regression-based
      agricultural land valuation. Fluent across survey, administrative, and geospatial
      data (R, Python, Google Earth Engine, PostGIS). Dual Ukrainian and German national.

  # ---- experience --------------------------------------------------------------

  - type: experience
    period: "Feb 2025 — present"
    title: "Economist, Global Poverty Department"
    title-short: "Economist (ETC2)"
    place: "The World Bank · Washington DC"
    in: [short, full]
    summary: >-
      As a land and poverty economist in the Global Poverty Department (WKPEP) I build
      client-ready solutions for poverty mapping and small area estimation,
      introduced AI-assisted coding in R and Stata to economists Bank-wide,
      contributed to the fiscal insidences analysis and distributional analysis
      of macro-shocks on households as well as conduct research on the
      impact evaluation of land reforms with the Development Research Group (DEC).

    description: |
      Highlights:

      - *Land economics and Ukraine.* Research on the Ukrainian land market and
        technical assistance to the State Cadaster: consulting on the Land Parcel
        Identification System (LPIS) and on mass valuation of agricultural land, and
        piloting the [mass appraisal of urban land](https://doi.org/10.1016/j.landusepol.2026.107976).
      - *Microdata analysis, small area estimation and poverty mapping.* Contributed
        to EU-wide poverty mapping and to missions to Poland, and trained the Polish
        national statistical office to run small area estimates of its own.
        Developed R-Shiny based dashboard on extracting
      - *AI-assisted coding.* Led the Bank-wide initiative on AI-assisted coding in R
        and Stata. Launched a seminar series and internal training; the
        [ai4coding](https://worldbank.github.io/ai4coding/) course reached 600+ staff
        through the Open Learning Campus; introduced Positron and Quarto as
        Bank-standard tools for reproducible research.
      - *GeoPov.* Co-initiated the GeoPov work programme on the nexus of remotely
        sensed geospatial and individual microdata, measuring the extent and the
        determinants of spatial income and welfare disparities. Led development
        of the [project targeting index](https://worldbank.github.io/devPTIpack/)
        and its application across countries.
      - *Micro Modelling Lab.* Engineered the data pipelines behind macro–micro
        microsimulations, and [guided economists on scaling and replicating] (https://worldbank.github.io/mml/)
        these method across countries. Created infrastructure for the R-Shiny
        based dashboards for fiscal incidences analysis [devCEQ](https://worldbank.github.io/devCEQ/)
        and supported countries in implementing this analysis.

    references: "Klaus W. Deininger; Carolina Diaz-Bonilla; Nobuo Yoshida"

  - type: experience
    period: "Jan 2020 — Dec 2024"
    title: "Lecturer and researcher"
    title-short: "Lecturer"
    place: "Justus Liebig University Giessen · Germany"
    in: [short, full]
    summary: >-
      As a researcher at the Institute for Agricultural Policy and Market Research I
      worked across a range of micro- and macroeconomic topics, focusing on land
      markets and on policy impact evaluation. Alongside this I taught two
      Master's-level courses in applied econometrics for the social sciences, and
      wrote my PhD thesis.

    description: |
      Highlights:

      - *Teaching.* The challenge was to equip an interdisciplinary cohort of
        development economists with an intuition for causal thinking and the know-how
        to implement statistical analysis and hypothesis testing. I taught the
        introductory course to the full cohort and Applied Econometrics to a
        self-selected group.
      - *Research.* A microeconometric portfolio built on farm-level data:
        [land market efficiency in Ukraine](https://doi.org/10.1016/j.landusepol.2024.107336)
        and the [land privatization reform in Kazakhstan](https://doi.org/10.1016/j.landusepol.2025.107741),
        which yielded [several publications](https://ebukin.github.io/publications.html) in *Land Use Policy*
        and other journals. On [ROCHADE](https://rochade-project.org/en/front-page) — a
        project funded by the German Federal Ministry of Education and Research (BMBF,
        01LA1828A/B/C/D) — I worked as macroeconomist, trade data analyst, CGE modeller
        and GAMS programmer, publishing in
        [Environmental and Resource Economics](https://link.springer.com/article/10.1007/s10640-022-00698-7)
        and [Environmental Research Letters](https://iopscience.iop.org/article/10.1088/1748-9326/ad34e9).
      - *PhD thesis.* On Kazakhstan's land privatization reform, assessing the impact
        of the policy on both agricultural production and land productivity. It pairs
        cadastral records of land allocation and parcel geometry covering 100 million
        hectares with remotely sensed measures of climate, vegetation and land cover,
        and identifies the effect with quasi-experimental methods: staggered and
        continuous-treatment difference-in-differences (DiD).

    references: "Prof. Dr. Martin Petrick"

