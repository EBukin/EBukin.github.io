# The CV record — written down once, typeset by the {{< cv >}} shortcode
# (_templates/cv.lua) into the timeline on cv.qmd and into the sections of the two
# Typst CVs. _quarto.yml merges this file into every page's metadata via
# `metadata-files:`, so editing here updates the web page and the PDFs together.
#
# This is the sibling of _publications.yml and deliberately shares its vocabulary:
# the same `summary:` / `description:` fields, and the same `show=none|summary|full`
# option. Read the two files side by side.
#
# ---------------------------------------------------------------------------------
# `cv-me:` — who the CV is about. The two PDFs print no name, no contact line and no
# appointment of their own: {{< cv-header >}} draws the whole identity block from
# here, so neither .qmd file has to write down a fact about the person.
#
#   name        the CV's title. The last word is set in semibold against a lighter
#               given name, which is the modern-cv (Awesome-CV) signature
#   headline    the one-line professional identity, under the name in the accent
#   positions   current appointments, joined with ` · ` on the line below
#   links       the contact line: one `text:` / `url:` pair per link, in order.
#               Only what the website already publishes: this file is in a public
#               repository. Location, nationality, phone and email go in the
#               gitignored _cv-private.yml instead (shape in _cv-private.example.yml),
#               printed only by a CV that asks with {{< cv-header private=true >}}.
#               `_quarto.yml` keeps its own copy of these URLs for
#               the navbar and footer and cannot read this file, so the two lists
#               have to be kept in step by hand
#   updated     printed in the PDF footer, and next to the download buttons on
#               cv.qmd via {{< meta cv-me.updated >}}. Bump it when this file changes
#
# ---------------------------------------------------------------------------------
# Three shapes of entry, told apart by `type:`.
#
# A PROSE BLOCK — type: profile
#
#   text        the About / Profile paragraph at the top of a CV, Markdown, one
#               entry per variant chosen with `in:`. This is the last piece of CV
#               prose that used to be written in the .qmd files. The index.qmd bio is
#               one of these too: the `ds-causal-short` profile
#
# A DATED ENTRY — type: experience | education | teaching | project | software
#
# The last two carry no dates — see the note above those entries — but are otherwise
# the same shape and are typeset by the same code. projects.qmd is built from them.
#
#   period        the date range, as displayed. Never parsed, never sorted on.
#                 Omitted entirely by an entry that has no dates to show
#   title         the role, degree or course. Shown in Spectral as the entry's heading
#   title-short   optional trimmed title, used only where the shortcode runs with
#                 titles=short (cv-short.qmd), so the two-page CV keeps its headings
#                 to one line. Same idea as `title-short:` in _publications.yml
#   place         employer, university or programme, plus location
#   place-short   optional trimmed place, same rule as `title-short`
#   summary       the short form, a sentence or two. It is the row on the web, closed
#                 and open alike, and the whole entry in the CVs at show=summary
#   description   what the summary does NOT say, Markdown — links, emphasis and bullet
#                 lists all work. MUST NOT REPEAT `summary:`. The two are printed one
#                 after the other, so this continues the summary rather than restating
#                 it; cv.lua warns at render time if it opens by repeating it
#   references    optional; people who can be contacted about the position. Printed
#                 only in the PDFs, and only at show=full
#   materials     teaching only. Where the course's materials are, AS DATA: a `lead:`
#                 (the words before the dash — "Materials, one set per cohort") and
#                 `sets:`, one per cohort, each a `url:`, an optional `source:`
#                 repository, an optional `name:` (the cohort, "2023–24"; the address
#                 stands in without one), a `text:` saying what the set holds, and an
#                 optional `note:` for a caveat. cv.lua appends the one-line form to
#                 `summary:` wherever the summary prints, and prints the whole block
#                 only at show=materials — teaching.qmd. See the teaching section
#
# A FLAT LIST — type: languages | scholarships
#
#   label         the row's name on the web — "Languages". The PDFs take their heading
#                 from the `##` in the .qmd, so it is ignored there
#   items         a list of strings. Rendered as chips on the web and as a ` · `
#                 separated paragraph in the PDFs. No dates, no disclosure
#
# A SKILL GROUP — type: expertise
#
# Website only. cv.lua renders it for HTML and emits nothing for Typst, so no PDF
# carries it and one that asks gets a render-time warning. See the note above those
# entries for why the skills taxonomy is not in the CVs.
#
#   label         the group's name, printed in the narrow left column of its own
#                 section on cv.qmd — "Programming languages", "Software development"
#   skills        a list of `name:` / `text:` pairs, each rendered as one row: the name
#                 in the entry face over its line of detail. NOT `items:` — that is the
#                 flat string list above, and the two keys are what tell the shapes
#                 apart in cv.lua
#
# ALL FOUR SHAPES
#
#   in            which CV variants include the entry: short or full.
#                 The analogue of `selected:` in _publications.yml. Omitted means both.
#                 On the web page this becomes a data-in attribute and the Short / Full
#                 buttons filter on it. A profile may instead name a job-specific
#                 variant, such as JRC-tax-2026 — see the note above the profiles
#
# Markdown is parsed in every field, so a subscript is written `CO~2~` once and comes
# out as <sub>2</sub> in HTML and CO#sub[2] in Typst. Never write format-specific
# syntax here.
#
# ORDER IS FILE ORDER, within a type. Unlike _publications.yml, nothing is sorted —
# `period:` is a display string, not a date. Move an entry to reorder it.
#
# ---------------------------------------------------------------------------------
# Which page prints how much:
#
#   cv.qmd              every entry, summary then description, and the short and full
#                       profiles under Highlights; the buttons choose depth
#   index.qmd           the ds-causal-short profile, as the lede under the name
#   projects.qmd        type=project and type=software
#   teaching.qmd        type=teaching show=materials — every course open, with the
#                       materials block under it
#   cv/cv-full.qmd      in=full      show=full       summary + long text, references
#   cv/cv-short.qmd     in=short     show=summary    one sentence per entry
#   cv/Bukin-cv-JRC-tax-2026.qmd     as cv-full.qmd, but its About is the
#                                    JRC-tax-2026 profile. Never deployed
#   cv/Bukin-cv-general.qmd          as cv-full.qmd, but its About is the general
#                                    profile. Never deployed
#
# NO CV PRINTS SKILLS ANY MORE. The flat chip row the PDFs carried is gone, and what
# replaced it — the `type: expertise` taxonomy below — is rendered for the website
# alone. The four-page CVs got the space back; the reader who wants the full list has
# it on cv.qmd, where length costs nothing.

cv-me:
  name: "Eduard Bukin"
  headline: "Applied Economist and Open Source Data Scientist"
  positions:
    - "Economist, Global Poverty Department, The World Bank"
    - "PhD candidate, Justus Liebig University Giessen"
  links:
    - text: "ebukin.github.io"
      url: "https://ebukin.github.io"
    - text: "github.com/EBukin"
      url: "https://github.com/EBukin"
    - text: "linkedin.com/in/ebukin"
      url: "https://www.linkedin.com/in/ebukin/"
    - text: "Google Scholar"
      url: "https://scholar.google.com/citations?hl=en&user=JtxmtwgAAAAJ&view_op=list_works&sortby=pubdate"
    - text: "ORCID 0000-0002-1003-1260"
      url: "https://orcid.org/0000-0002-1003-1260"
  updated: "September 2026"

cv:

  # ---- profile -----------------------------------------------------------------
  #
  # One paragraph per variant, written to its own length. Nothing else in the CVs is
  # prose about the person.
  #
  # `full` and `short` are the generic pair: the About / Profile paragraph of the two
  # public PDFs, and the Highlights paragraph on cv.qmd. A profile tagged with any other
  # variant name is written for one application and is printed only by the CV file that
  # asks for that name. No page on the site does, and the publish workflow deletes
  # every PDF but the two public ones before it deploys, so those CVs are built by
  # every render and published by none.

  - type: profile
    in: [full]
    text: |
      Economist working where poverty, fiscal policy and land meet, with a decade of
      quantitative policy analysis at the World Bank, FAO and in academia. At the World
      Bank I build the tools behind poverty and distributional analysis: Commitment to
      Equity (CEQ) fiscal incidence microsimulations for eight countries and the devCEQ R
      package that scales them, the data pipelines that link macroeconomic scenarios to
      household microdata, small area estimates for poverty mapping, and GeoPov, which
      joins geospatial and micro data to measure spatial welfare disparities. My research
      is in land economics and impact evaluation: peer-reviewed work on farmland markets,
      valuation and taxation in Ukraine — including analysis code adopted by the State
      Cadaster as the basis for regression-based agricultural land valuation — and a
      quasi-experimental evaluation of land privatization in Kazakhstan. I have built
      equilibrium models in GAMS for the OECD-FAO Agricultural Outlook and a CGE project,
      and work across survey, administrative and geospatial data in R, Stata, Python and
      Google Earth Engine. I have taught econometrics at master's level, trained
      government counterparts and national statistical offices, and built a course on
      AI-assisted coding taken by more than 600 World Bank staff.

  - type: profile
    in: [short]
    text: |
      Economist working on poverty, fiscal policy and land, with a decade of quantitative
      policy analysis at the World Bank, FAO and in academia. Builds fiscal incidence
      microsimulations (CEQ) and poverty-mapping tools; peer-reviewed research on land
      markets, valuation and taxation in Ukraine and on land reform in Kazakhstan, with
      analysis code adopted by the Ukrainian State Cadaster. Fluent across survey,
      administrative and geospatial data (R, Stata, Python, Google Earth Engine).

  - type: profile
    in: [JRC-tax-2026]
    text: |
      Economist and data scientist specialising in fiscal microsimulation and applied
      economic modelling, with a decade of quantitative policy analysis at the World
      Bank, FAO and in academia. Since 2018 I have carried out Commitment to Equity (CEQ)
      fiscal incidence analysis for countries in Africa, Asia, Europe and Latin America,
      measuring how taxes and transfers shape equity and inequality across households.
      I built R Shiny tools that simulate the counterfactual welfare effects of
      alternative tax and spending policies, and developed devCEQ, the R package that
      scales this analysis across countries. At the World Bank's Micro-Modelling Lab I
      engineer the data pipelines that carry macroeconomic scenarios down to household
      microdata. I have programmed in R, Stata, Python and GAMS for more than a decade,
      and maintained partial and general equilibrium models: FAO's AGLINK-COSIMO country
      modules for the OECD-FAO Agricultural Outlook 2017–2026, and a CGE model for the
      BMBF-funded ROCHADE project. I have also worked with household, farm-level and
      administrative microdata for poverty measurement and small area estimation,
      trained government counterparts and national statistical offices, organised
      seminar series and workshops, and taught econometrics at master's level.

  - type: profile
    in: [JRC-indicators-2026]
    text: |
      Applied economist and open-source data scientist with a decade of
      quantitative policy analysis at the World Bank, FAO and in academia,
      specialising in turning heterogeneous data into indicator frameworks,
      visualisations and tools that policymakers can use and analysts can
      maintain. R and R Shiny are the centre of my toolbox: for the World
      Bank's poverty practice I built the devCEQ package and Shiny applications
      that let non-technical users run counterfactual fiscal microsimulations,
      and the methodology and devPTIpack package behind the Project Targeting
      Index, a spatial composite index for geographic targeting; I contribute
      to EU-wide poverty mapping and small area estimation, and to the GeoPov
      programme combining remotely sensed data with household microdata to
      measure territorial disparities. My research applies quasi-experimental
      designs to cadastral, survey and satellite data, with eight peer-reviewed
      articles, mostly in Land Use Policy, and a PhD evaluating land
      privatisation in Kazakhstan; I have led survey data collection in South
      Africa, Kazakhstan and neighbouring Central Asian countries. Innovation
      and capacity building are, for me, one job. I brought version control
      and reproducible pipelines to economists' workflows, made Positron and
      Quarto standard tools at the World Bank, and in 2026 designed and taught
      the Bank's internal course on AI-assisted coding in R and Stata, taken
      by more than 600 staff, which created a demand for the tools and the
      skills that colleagues now pursue on their own. I have trained master's
      students, finance ministry analysts in Indonesia and Georgia, and
      Statistics Poland's statisticians, each time leaving behind code they
      maintain themselves. I am now extending this toolkit to
      retrieval-augmented generation and Model Context Protocol interfaces,
      so that indicators and their methodology can be queried by AI agents
      as reliably as by people.

  - type: profile
    in: [JRC-survey-FGIV-003132]
    text: |
      Applied economist and open-source data scientist with a decade of
      quantitative policy analysis at the World Bank, FAO and in academia,
      working almost entirely on survey microdata: collecting it, turning it
      into evidence, and building the tools that let others do the same.
      My survey experience starts in the field: I led household data collection
      for an impact assessment in South Africa and the second wave of the IAMO
      Farm Survey in Kazakhstan and neighbouring Central Asian countries,
      from questionnaire design and pre-testing to interviewer training and
      quality control, and designed the sampling frame for a randomised
      controlled trial on land institutions in Ukraine. Since 2018 I have used
      household surveys at the World Bank for fiscal incidence and
      counterfactual microsimulation with the Commitment to Equity method,
      and for poverty mapping through unit-level small area estimation that
      combines survey, census, administrative and geospatial data, including
      in the EU poverty-mapping project. R and R Shiny are the centre of
      my toolbox; I built the devCEQ package and Shiny applications that let
      ministry analysts run their own simulations and see the results.
      My research applies quasi-experimental designs and microeconometrics
      to farm survey, cadastral and satellite data, with peer-reviewed
      articles and a PhD evaluating land privatisation in Kazakhstan.
      Innovation and capacity building are, for me, one job: I brought
      version control and reproducible pipelines to economists' workflows,
      made Positron and Quarto standard tools at the World Bank, and designed
      and taught the Bank's internal course on AI-assisted coding in R and
      Stata, which created a demand for skills that colleagues now pursue on
      their own. I have taught statistics and econometrics to master's students
      for five years and trained finance ministry analysts in Indonesia and
      Georgia and Statistics Poland's statisticians in small area estimation,
      each time leaving behind code they maintain themselves. I am now
      exploring how retrieval-augmented generation and Model Context Protocol
      interfaces can speed up survey analysis and make survey methodology as
      accessible to AI agents as to people.

  - type: profile
    in: [gis-generic]
    text: |
      Applied economist and geospatial data scientist with a decade of
      quantitative work at the World Bank, FAO and in academia, specialising in
      combining Earth observation, cadastral and household survey data to
      target, monitor and evaluate development policies. My doctoral research
      is an impact evaluation of land privatiation on rangeland quality
      southern Kazakhstan leverages satellite-derived vegetation, land cover
      and climate data, with a staggered difference-in-differences design
      that isolates the effect of land privatisation on pasture productivity
      published in Land Use Policy. At the World Bank I developed the
      methodology and the devPTIpack R package behind the Project Targeting Index,
      which integrates geospatial and socio-economic data to improve the
      spatial targeting of operations and has been applied in more than 30
      countries, and co-initiated the GeoPov programme, which combines
      remotely sensed data with household microdata to measure spatial
      disparities in income and welfare. I use geospatial data in small area
      estimation for poverty mapping, including in the EU poverty-mapping
      project, and have supported the State Cadastre of Ukraine on
      mass valuation of agricultural and urban land with the underlining data
      being remotely sensed. My workflows run in R, Python and Google
      Earth Engine, with QGIS and PostgreSQL/PostGIS, and are built as
      version-controlled, reproducible pipelines and packages that
      colleagues reuse; I have processed satellite time series, land cover
      and terrain products and delivered the results as R Shiny dashboards
      for non-technical users. Sector experience covers agriculture and land
      governance, livestock and rangeland systems, agricultural statistics and
      greenhouse gas emissions at FAO, and fiscal and poverty analysis,
      with fieldwork in South Africa and Central Asia. I teach and build
      capacity as part of the same work: master's courses in econometrics,
      training for finance ministries and statistics offices, and
      the World Bank's staff on AI-assisted coding in R and Stata, taken by more
      than 600 economists.


  - type: profile
    in: [ra-generic]
    text: |
      Applied economist and data scientist with a decade of quantitative work
      at the World Bank, FAO and in academia, moving policy questions through
      data engineering and econometric analysis to results that decision-makers
      use and colleagues can maintain. My experience spans both ends of the
      data: on the macro side, I maintained the AGLINK-COSIMO partial equilibrium
      model, built the databases behind FAOSTAT's greenhouse gas emissions
      statistics, and worked as a CGE modeller in the BMBF-funded ROCHADE project;
      on the micro side, I apply econometric and microsimulation methods to
      household survey, administrative and cadastral microdata for fiscal
      incidence analysis, poverty mapping and small area estimation, and I
      engineer the pipelines that carry macroeconomic scenarios down to
      household level in the World Bank's Micro-Modelling Lab. My research uses
      quasi-experimental designs on panel, spatial and remotely sensed data to
      evaluate land reforms in Ukraine and Kazakhstan, with articles in Land
      Use Policy, Environmental and Resource Economics and Environmental
      Research Letters, each backed by a public reproducibility package.
      I work in R, Stata, Python and SQL and build version-controlled,
      reproducible pipelines and open-source packages (devCEQ, devPTIpack)
      that teams reuse across countries. I bring new tools into economists'
      daily work: I introduced Git-based workflows and ETL-style data
      pipelines to World Bank modelling teams, and in 2026 made Positron and
      Quarto available Bank-wide and designed the ai4coding course on
      AI-assisted programming in R and Stata, taken by more than 600 staff.
      I have taught statistics and econometrics at master's level for five
      years and trained finance ministries and national statistical offices.

  - type: profile
    in: [JRC-tax-2026-short]
    text: |
      Economist specialising in fiscal microsimulation and applied economic modelling.
      CEQ fiscal incidence models of taxes and transfers for eight countries since 2018,
      and the devCEQ R package that scales them; published research on land valuation
      and taxation reform in Ukraine; equilibrium modelling in GAMS for the OECD-FAO
      Agricultural Outlook and a CGE project. Works across household, farm-level and
      administrative microdata (R, Stata, Python).

  # The general application profile, printed only by cv/Bukin-cv-general.qmd — the CV
  # to send where no vacancy-specific one has been written. It starts from the website's
  # framing (the ds-causal-short lede) and carries the fiscal-incidence and tooling work
  # of the JRC-tax-2026 profile, in its own words rather than either one's.
  - type: profile
    in: [general]
    text: |
      Applied economist and data scientist who turns the nexus of micro, spatial and
      administrative data into causal evidence, and that evidence into tools that others
      use. For more than a decade, at the World Bank, FAO and in academia, I have
      measured how households, farms and land markets respond to policy using
      quasi-experimental methods. Since 2018 I have carried out fiscal incidence analysis
      and poverty measurement for countries in Africa, Asia, Europe and Latin America. I
      build the pipelines and R Shiny tools that simulate the welfare effects of
      alternative tax and spending policies, macroeconomic shocks and climate change, and
      I have developed the supporting R package and infrastructure that scale this
      analysis and enable others to carry it out on their own. Over the same period my
      research has focused on agricultural and development economics, assessing how
      policies affect land markets, valuation and taxation. I have also contributed to
      operational work, such as capacity building for statistical offices and cadastres
      in European and Asian countries. My technical capabilities are shaped by
      open-source software development and data science, so I embrace Git and GitHub,
      rely heavily on R and Python, and work with cloud-based solutions for spatial data
      analysis such as Google Earth Engine. Finally, I like to innovate and to enable
      others by motivating and teaching them, whether that means teaching applied
      econometrics to master's students at JLU Giessen or leading the adoption of
      AI-assisted coding among economists at the World Bank. I believe that sharing and
      enabling others is the only way to scale the impact of my work.

  # Generic profile for data science and causal inference roles on micro-level data.
  # It is the lede on index.qmd, which prints it with {{< cv type=profile
  # in=ds-causal-short >}}; no CV prints it yet.
  - type: profile
    in: [ds-causal-short]
    text: |
      Applied economist and data scientist who turns messy micro-level data into causal
      evidence, and that evidence into tools that others use. For more than a decade,
      at the World Bank, FAO and in academia, I have measured how households, farms and
      land markets respond to policy, pairing quasi-experimental methods with survey,
      administrative and satellite data. I then build the analysis to scale:
      open-source R packages, solutions implemented by governments and national
      statistical offices, and training for the people who carry them forward.
      Innovation drives my work, and I bring it into the teams and work of my
      colleagues: helping them put generative AI to use in coding and analysis, adopt
      modern, reproducible workflows, and build the capacity to keep innovating on
      their own.

  # ---- experience --------------------------------------------------------------

  - type: experience
    period: "Feb 2025 — present"
    title: "Economist, Global Poverty (full-time: 40 h/week)"
    title-short: "Economist (ETC2)"
    place: "The World Bank · Washington DC"
    in: [short, full]
    summary: >-
      Build client-ready tools for poverty mapping and small area estimation;
      contribute to fiscal incidence analysis and to the distributional analysis
      of macroeconomic shocks on households; lead the Bank-wide adoption of
      AI-assisted coding in R and Stata; and research the impact of land reforms
      with the Development Research Group (DEC).

    description: |
      Highlights:

      - *Land economics and Ukraine.* Research on the Ukrainian land market and
        technical assistance to the State Cadaster: consulting on the Land Parcel
        Identification System (LPIS) and on mass valuation of agricultural land, and
        piloting the [mass appraisal of urban land](https://doi.org/10.1016/j.landusepol.2026.107976).
      - *Microdata analysis, small area estimation and poverty mapping.* Contributed
        to EU-wide poverty mapping and to missions to Poland, and trained the Polish
        national statistical office to produce its own small area estimates.
      - *AI-assisted coding.* Launched a seminar series and internal training,
        including the [ai4coding](https://worldbank.github.io/ai4coding/) course,
        which reached 600+ staff through the Open Learning Campus; introduced
        Positron and Quarto as Bank-standard tools for reproducible research.
      - *GeoPov.* Co-initiated the GeoPov work programme, which combines remotely
        sensed geospatial data with microdata to measure the extent and
        determinants of spatial income and welfare disparities. Led the development
        of the [Project Targeting Index](https://github.com/wbPTI) and its application
        across countries.
      - *Micro-Modelling Lab (MML).* Engineered the data pipelines behind macro–micro
        simulations and
        [guided economists in scaling and replicating these methods across countries](https://worldbank.github.io/mml/).
        Built the infrastructure for the fiscal incidence dashboards in R Shiny
        ([devCEQ](https://worldbank.github.io/devCEQ/)) and supported countries in
        implementing the analysis.

    references: "Klaus W. Deininger; Carolina Diaz-Bonilla; Nobuo Yoshida"

  - type: experience
    period: "Jan 2020 — Dec 2024"
    title: "Lecturer and researcher (part-time: 20 h/week)"
    title-short: "Lecturer"
    place: "Justus Liebig University Giessen · Germany"
