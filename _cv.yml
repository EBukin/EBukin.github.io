  # ---- education ---------------------------------------------------------------

  - type: education
    period: "2024 — Dec 2026"
    title: "PhD, Agricultural Economics"
    place: "Justus Liebig University Giessen"
    place-short: "JLU Giessen"
    in: [short, full]
    summary: "Land privatization and pasture quality in southern Kazakhstan, evaluating the impact of a natural experiment."
    description: |
      Land privatization and pasture quality in southern Kazakhstan, evaluating the
