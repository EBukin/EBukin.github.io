  # ---- teaching ----------------------------------------------------------------

  - type: teaching
    period: "2020 — 2024"
    title: "Introduction to Statistics and Econometrics"
    place: "MSc · English · JLU Giessen"
    in: [full]
    summary: "Foundations for social-science research: probability, estimation, inference, and the linear model."
    description: |
      Foundations for social-science research: probability, estimation, inference, and
