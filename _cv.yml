# The CV record — written down once, typeset by the {{< cv >}} shortcode
# (_templates/cv.lua) into the timeline on cv.qmd and into the sections of the two
# Typst CVs. _quarto.yml merges this file into every page's metadata via
# `metadata-files:`, so editing here updates the web page and the PDFs together.
#
# This is the sibling of _publications.yml and deliberately shares its vocabulary:
# the same `summary:` / `description:` fields, and the same `show=none|summary|full`
# option. Read the two files side by side.
#
# ---------------------------------------------------------------------------------
# `cv-me:` — who the CV is about. The two PDFs print no name, no contact line and no
# appointment of their own: {{< cv-header >}} draws the whole identity block from
# here, so neither .qmd file has to write down a fact about the person.
#
#   name        the CV's title. The last word is set in semibold against a lighter
#               given name, which is the modern-cv (Awesome-CV) signature
#   headline    the one-line professional identity, under the name in the accent
#   positions   current appointments, joined with ` · ` on the line below
#   links       the contact line: one `text:` / `url:` pair per link, in order.
#               Deliberately no postal address, no phone, no date of birth and no
#               email — only what the website already publishes. Adding any of them
#               is one entry here. `_quarto.yml` keeps its own copy of these URLs for
#               the navbar and footer and cannot read this file, so the two lists
#               have to be kept in step by hand
#   updated     printed in the PDF footer, and next to the download buttons on
#               cv.qmd via {{< meta cv-me.updated >}}. Bump it when this file changes
#
# ---------------------------------------------------------------------------------
# Three shapes of entry, told apart by `type:`.
#
# A PROSE BLOCK — type: profile
#
#   text        the About / Profile paragraph at the top of a CV, Markdown, one
#               entry per variant chosen with `in:`. This is the last piece of CV
#               prose that used to be written in the .qmd files. The index.qmd bio is
#               still written separately, because it is written to a different length
#
# A DATED ENTRY — type: experience | education | teaching | project | software
#
# The last two carry no dates — see the note above those entries — but are otherwise
# the same shape and are typeset by the same code. projects.qmd is built from them.
#
#   period        the date range, as displayed. Never parsed, never sorted on.
#                 Omitted entirely by an entry that has no dates to show
#   title         the role, degree or course. Shown in Spectral as the entry's heading
#   title-short   optional trimmed title, used only where the shortcode runs with
#                 titles=short (cv-short.qmd), so the two-page CV keeps its headings
#                 to one line. Same idea as `title-short:` in _publications.yml
#   place         employer, university or programme, plus location
#   place-short   optional trimmed place, same rule as `title-short`
#   summary       the short form, a sentence or two. It is the row on the web, closed
#                 and open alike, and the whole entry in the CVs at show=summary
#   description   what the summary does NOT say, Markdown — links, emphasis and bullet
#                 lists all work. MUST NOT REPEAT `summary:`. The two are printed one
#                 after the other, so this continues the summary rather than restating
#                 it; cv.lua warns at render time if it opens by repeating it
#   references    optional; people who can be contacted about the position. Printed
#                 only in the PDFs, and only at show=full
#
# A FLAT LIST — type: skills | languages | scholarships
#
#   label         the row's name on the web — "Skills", "Languages". The PDFs take
#                 their heading from the `##` in the .qmd, so it is ignored there
#   items         a list of strings. Rendered as chips on the web and as a ` · `
#                 separated paragraph in the PDFs. No dates, no disclosure
#
# ALL THREE SHAPES
#
#   in            which CV variants include the entry: short or full.
#                 The analogue of `selected:` in _publications.yml. Omitted means both.
#                 On the web page this becomes a data-in attribute and the Short / Full
#                 buttons filter on it
#
# Markdown is parsed in every field, so a subscript is written `CO~2~` once and comes
# out as <sub>2</sub> in HTML and CO#sub[2] in Typst. Never write format-specific
# syntax here.
#
# ORDER IS FILE ORDER, within a type. Unlike _publications.yml, nothing is sorted —
# `period:` is a display string, not a date. Move an entry to reorder it.
#
# ---------------------------------------------------------------------------------
# Which page prints how much:
#
#   cv.qmd              every entry, summary then description; the buttons choose depth
#   projects.qmd        type=project and type=software
#   teaching.qmd        type=teaching
#   cv/cv-full.qmd      in=full      show=full       summary + long text, references
#   cv/cv-short.qmd     in=short     show=summary    one sentence per entry
#
# The two-page CV prints languages but no skills, which is why `type: skills` is
# `in: [full]` — and why the Short view of cv.qmd hides that row too.

