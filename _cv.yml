      protocols, and built the first emissions-intensities database in FAOSTAT.

  - type: experience
    period: "2010 — 2015"
    title: "Earlier positions"
    place: "Pretoria · Kyiv · Twann"
    in: [full]
    summary: "Internships and junior research posts in inclusive business models, transfer pricing and agricultural information systems."
    description: |
      Internships and junior research posts in inclusive business models, transfer
      pricing and agricultural information systems. PGSARD, Pretoria — intern, inclusive
