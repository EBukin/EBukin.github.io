      income and welfare disparities. Co-initiated in the Global Poverty Department.

  - type: software
    title: "peaApp"
    place: "R Shiny application"
    summary: "Poverty and equity analysis, packaged so that a counterpart can run it without an analyst in the room."
    description: |
