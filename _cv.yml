  # ---- teaching ----------------------------------------------------------------
  #
  # THE ONLY RECORD OF TEACHING, for every CV and every page. _cv-r-training.yml used
  # to carry a second, reworded copy of these five entries for the NSO application CV;
  # it does not any more, and Bukin-cv-R-training-NSO.qmd reads them from here with a
  # call that carries no `from=`. What that CV actually needed was never different
  # words but a different POSITION — Teaching lifted into a section of its own above
  # Experience — and position is a property of the .qmd, not of the record. The two
  # copies had already begun to drift; this is why `from=` is a last resort.
  #
  # Every course carries its materials AS DATA, in `materials:` — one set per cohort,
  # the website first and its source repository second, because the materials were
  # rewritten each year and a single link would silently stand for the wrong cohort.
  # cv.lua reads the sets two ways. Everywhere the summary prints — the row on cv.qmd,
  # every CV at every depth — it appends the one-line form to it: "Materials, one set
  # per cohort — 2023–24 (source) · 2022–23 (source)." And at show=materials, which
  # only teaching.qmd asks for, it prints a block under the entry instead, with each
  # set's addresses, its `text:` and its `note:`. The line used to be written into
  # `summary:` by hand; generating it is what keeps every address written down once.
  #
  # The line rides with the summary and not the description because a CV that is not
  # applying for a teaching post prints teaching at show=summary and drops every
  # description — Bukin-cv-general.qmd and Bukin-cv-JRC-tax-2026.qmd both do — and a
  # link that lived in the description would vanish from exactly the CVs that have
  # room for nothing but the link.
  #
  # The site address is written as ebukin.github.io/<repo>/ whether or not that site is
  # published yet — the address is the stable fact, the deployment is not — and a set
  # whose repository is still private says so in its `note:` rather than losing the
  # link. A `text:` describes the SET, what was written for that cohort and how it is
  # organised; the course itself is the `summary:` and `description:` above it, so the
  # two must not say the same thing.

  - type: teaching
    period: "2026"
    title: "AI-assisted coding for economists"
    place: "The World Bank · Open Learning Campus"
    in: [short, full]
    summary: >-
      Designed and taught the Bank's internal course on using AI assistants and GitHub
      Copilot to write R and Stata code; taken by more than 600 staff.
    description: >-
      Delivering it meant changing the toolchain as well as teaching it: I had Quarto
      and the Positron IDE made available as Bank-wide software so that participants
      could practise reproducible workflows rather than only hear about them.
    materials:
      sets:
        - url: "https://worldbank.github.io/ai4coding/"
          source: "https://github.com/worldbank/ai4coding"
          text: >-
            Two days in the classroom with a self-study block between them. Before the
            first day, a setup guide for Stata, R and Python with Positron, Quarto, Git
            and GitHub Copilot, with troubleshooting for each step; day one, live
            demonstrations of cleaning data, reproducing an existing analysis and
            handling sensitive data under the Bank's guidelines; four guided self-study
            exercises; day two, multi-step agentic tasks, external tools through MCP
            and prompts written for one's own work. The April 2026 sessions at
            headquarters were recorded for Bank staff.

  # The two week-long counterpart programmes. They are entries here, and not just a
  # clause inside their employers above, because each one is a course: a cohort, a
  # syllabus that runs from the theory to the code, and a handover it is judged on.
  # Reverse-chronological with the rest, so they sit between 2026 and the JLU years.

  - type: teaching
    period: "2025"
    title: "Small area estimation and poverty mapping"
    place: "Statistics Poland (GUS) · Poznań · with The World Bank"
    in: [short, full]
    summary: >-
      A week with the national statistical office, teaching its statisticians to
      produce their own small area estimates of poverty for Poland at NUTS-2 and
      NUTS-3 level: the method, the R code that runs it, and how to maintain and
      extend the toolbox afterwards.
    description: |
      I wrote the software the course teaches before teaching it — R packages and
      structured data pipelines carrying the office's survey and census inputs through
      direct estimation and Fay–Herriot modelling to a subnational poverty map — and
      then delivered it in person at the Poznań centre. The week ran against the
      office's own data rather than a worked example, so the code was being improved
      and handed over at the same time, and it closed on the part that decides whether
      a toolbox outlives the project: how to maintain it and develop it further without
      me.
    materials:
      lead: "Curriculum and code"
      sets:
        - url: "https://github.com/wbEUPM/eupm-pl"
          text: >-
            A Quarto project that takes the office's statisticians through the pipeline
            one step at a time — the geometries, direct estimates from the survey, the
            auxiliary variables, Fay–Herriot models within a year and across years,
            their multivariate extension, an exploratory pass over the resulting poverty
            estimates and a comparison of the models — with the R functions and scripts
            behind each step and a pinned package environment, so that the office can
            rerun and extend it on its own.

  - type: teaching
    period: "2018 — 2025"
    title: "Fiscal incidence microsimulation with the CEQ method"
    place: "Ministries of finance and social policy · The World Bank"
    in: [short, full]
    summary: >-
      A week-long course per country for government analysts: the theory and mechanics
      of tax-and-transfer incidence on household survey microdata, the R and Stata code
      that implements it, and the R Shiny application that leaves the analysis in their
      hands.
    description: |
      I took the lead on the analysis these courses teach — country by country, the
      microsimulations that measure on household survey data how taxes and subsidies
      reach household welfare — and then adapted that methodology into web-based
      applications in R Shiny, deployed on Posit Connect and Shiny Server. What the
      client receives is therefore a tool rather than a report: ministries of finance
      and social policy simulate counterfactual tax and subsidy policies themselves and
      read off the distributional, poverty and inequality consequences for households.
      Each engagement hands over the simulation code in R and Stata alongside the
      dashboard.

      In Indonesia and Georgia I joined the country missions to teach it: a week each,
      opening on the incidence theory and the mechanics behind the numbers, moving to
      the code behind the tools, and closing on the capacity to develop them further —
      in R or in whichever language the counterpart team already works in.
    materials:
