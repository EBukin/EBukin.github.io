# The CV record — written down once, typeset by the {{< cv >}} shortcode
# (_templates/cv.lua) into the timeline on cv.qmd and into the sections of the two
# Typst CVs. _quarto.yml merges this file into every page's metadata via
# `metadata-files:`, so editing here updates the web page and the PDFs together.
#
# This is the sibling of _publications.yml and deliberately shares its vocabulary:
# the same `summary:` / `description:` fields, and the same `show=none|summary|full`
# option. Read the two files side by side.
#
# ---------------------------------------------------------------------------------
# `cv-me:` — who the CV is about. The two PDFs print no name, no contact line and no
# appointment of their own: {{< cv-header >}} draws the whole identity block from
# here, so neither .qmd file has to write down a fact about the person.
#
#   name        the CV's title. The last word is set in semibold against a lighter
#               given name, which is the modern-cv (Awesome-CV) signature
#   headline    the one-line professional identity, under the name in the accent
#   positions   current appointments, joined with ` · ` on the line below
#   links       the contact line: one `text:` / `url:` pair per link, in order.
#               Deliberately no postal address, no phone, no date of birth and no
#               email — only what the website already publishes. Adding any of them
#               is one entry here. `_quarto.yml` keeps its own copy of these URLs for
#               the navbar and footer and cannot read this file, so the two lists
#               have to be kept in step by hand
#   updated     printed in the PDF footer, and next to the download buttons on
#               cv.qmd via {{< meta cv-me.updated >}}. Bump it when this file changes
#
# ---------------------------------------------------------------------------------
# Three shapes of entry, told apart by `type:`.
#
# A PROSE BLOCK — type: profile
#
#   text        the About / Profile paragraph at the top of a CV, Markdown, one
#               entry per variant chosen with `in:`. This is the last piece of CV
#               prose that used to be written in the .qmd files. The index.qmd bio is
#               still written separately, because it is written to a different length
#
# A DATED ENTRY — type: experience | education | teaching | project | software
#
# The last two carry no dates — see the note above those entries — but are otherwise
# the same shape and are typeset by the same code. projects.qmd is built from them.
#
#   period        the date range, as displayed. Never parsed, never sorted on.
#                 Omitted entirely by an entry that has no dates to show
#   title         the role, degree or course. Shown in Spectral as the entry's heading
#   title-short   optional trimmed title, used only where the shortcode runs with
#                 titles=short (cv-short.qmd), so the two-page CV keeps its headings
#                 to one line. Same idea as `title-short:` in _publications.yml
#   place         employer, university or programme, plus location
#   place-short   optional trimmed place, same rule as `title-short`
#   summary       ONE SENTENCE. On the web it sits in the collapsed row; in the CVs it
#                 is the whole entry at show=summary
#   description   the long text, Markdown — links, emphasis and bullet lists all work.
#                 MUST BEGIN WITH THE EXACT TEXT OF `summary:`, because opening an
#                 entry on the web replaces the sentence with this. cv.lua warns at
#                 render time if the two have drifted apart
#   references    optional; people who can be contacted about the position. Printed
#                 only in the PDFs, and only at show=full
#
# A FLAT LIST — type: skills | languages | scholarships
#
#   label         the row's name on the web — "Skills", "Languages". The PDFs take
#                 their heading from the `##` in the .qmd, so it is ignored there
#   items         a list of strings. Rendered as chips on the web and as a ` · `
#                 separated paragraph in the PDFs. No dates, no disclosure
#
# ALL THREE SHAPES
#
#   in            which CV variants include the entry: short or full.
#                 The analogue of `selected:` in _publications.yml. Omitted means both.
#                 On the web page this becomes a data-in attribute and the Short / Full
#                 buttons filter on it
#
# Markdown is parsed in every field, so a subscript is written `CO~2~` once and comes
# out as <sub>2</sub> in HTML and CO#sub[2] in Typst. Never write format-specific
# syntax here.
#
# ORDER IS FILE ORDER, within a type. Unlike _publications.yml, nothing is sorted —
# `period:` is a display string, not a date. Move an entry to reorder it.
#
# ---------------------------------------------------------------------------------
# Which page prints how much:
#
#   cv.qmd              every entry, both summary and description; the buttons choose
#   projects.qmd        type=project and type=software
#   teaching.qmd        type=teaching
#   cv/cv-full.qmd      in=full      show=full       long text, references
#   cv/cv-short.qmd     in=short     show=summary    one sentence per entry
#
# The two-page CV prints languages but no skills, which is why `type: skills` is
# `in: [full]` — and why the Short view of cv.qmd hides that row too.

cv-me:
  name: "Eddie Bukin"
  headline: "Land and poverty economist"
  positions:
    - "Economist, Global Poverty Department, The World Bank"
    - "PhD candidate, Justus Liebig University Giessen"
  links:
    - text: "ebukin.github.io"
      url: "https://ebukin.github.io"
    - text: "github.com/EBukin"
      url: "https://github.com/EBukin"
    - text: "linkedin.com/in/ebukin"
      url: "https://www.linkedin.com/in/ebukin/"
    - text: "Google Scholar"
      url: "https://scholar.google.com/citations?hl=en&user=JtxmtwgAAAAJ&view_op=list_works&sortby=pubdate"
    - text: "ORCID 0000-0002-1003-1260"
      url: "https://orcid.org/0000-0002-1003-1260"
  updated: "September 2026"

cv:

  # ---- profile -----------------------------------------------------------------
  #
  # One paragraph per variant, written to its own length. Nothing else in the CVs is
  # prose about the person.

  - type: profile
    in: [full]
    text: |
      Land and poverty economist with a decade of research and hands-on operational
      experience in Ukrainian land markets, institutions, and valuation. My work combines
      rigorous impact evaluation with the practical business of making land data usable:
      published peer-reviewed research on farmland pricing, rental-market efficiency, and
      land valuation and taxation in Ukraine, and direct technical assistance to the State
      Cadaster — including analysis code adopted as the basis for regression-based
      agricultural land valuation. My current pipeline extends this into urban mass
      valuation (real estate listing data combined with Cadaster and Registry of Rights
      records) and a large-scale impact evaluation of land reform in Kazakhstan. I work
      fluently across survey, administrative, and geospatial data (R, Python, Google Earth
      Engine, PostGIS), and have consulted on the Land Parcel Identification System and
      mass valuation of agricultural land. Alongside my research I have several years'
      experience teaching applied econometrics and impact-evaluation methods and building
      analytical capacity with clients and national statistical offices.

  - type: profile
    in: [short]
    text: |
      Land and poverty economist with a decade of research and operational experience in
      Ukrainian land markets, institutions, and valuation. Peer-reviewed work on farmland
      pricing, rental-market efficiency, and land valuation and taxation; analysis code
      adopted by the Ukrainian State Cadaster as the basis for regression-based
      agricultural land valuation. Fluent across survey, administrative, and geospatial
      data (R, Python, Google Earth Engine, PostGIS). Dual Ukrainian and German national.

  # ---- experience --------------------------------------------------------------

  - type: experience
    period: "Feb 2025 — present"
    title: "Economist, Global Poverty Department"
    title-short: "Economist (ETC2)"
    place: "The World Bank · Washington DC"
    in: [short, full]
    summary: >-
      Innovation and systems engineering for global poverty analysis, as well as
      land-economics research and operational support to the Ukrainian State Cadastre.
    description: |
      Innovation and systems engineering for global poverty analysis, with continuing
      land-economics research and operational support to the Ukrainian State Cadastre.
      The work programme in the Global Poverty Department (WKPEP):

      - *Land economics and Ukraine.* Co-authored research on the Ukrainian land market;
        technical assistance to the State Cadaster; consulting on the Land Parcel
        Identification System (LPIS) and mass valuation of agricultural land; piloted
        mass appraisal of urban land. Implemented the agricultural land valuation
        adopted by the Ukrainian State Cadastre.
      - *AI-assisted coding.* Led the Bank-wide initiative on AI-assisted coding in R
        and Stata. Launched a seminar series and internal training; the
        [ai4coding](https://worldbank.github.io/ai4coding/) course reached 600+ staff
        through the Open Learning Campus; introduced Positron and Quarto as
        Bank-standard tools for reproducible research.
      - *GeoPov.* Co-initiated the department programme joining geospatial and micro
        data to read spatial income and welfare disparities.
      - *Micro Modelling Lab.* Engineered data pipelines for macro–micro fiscal
        microsimulations as part of the MML standardization initiative.
      - *EU poverty mapping.* Contributed to EU-wide poverty mapping and missions to
        Poland; trained the Polish national statistical office.
    references: "Klaus W. Deininger; Carolina Diaz-Bonilla; Nobuo Yoshida"

  - type: experience
    period: "Jan 2020 — Dec 2024"
    title: "Lecturer (wissenschaftlicher Mitarbeiter)"
    title-short: "Lecturer"
    place: "Justus Liebig University Giessen · Germany"
    in: [short, full]
    summary: "Research at the Institute for Agricultural Policy and Market Research on land markets and institutions, alongside two MSc courses and a doctoral thesis."
    description: |
      Research at the Institute for Agricultural Policy and Market Research on land
      markets and institutions, alongside two MSc courses and a doctoral thesis.
      Farm restructuring and returns to scale, rental-market efficiency in Ukraine,
      land-policy evaluation in Kazakhstan, and resource market failures in transition
      agriculture.

      - Introduced *Applied Econometrics*, teaching the path from cause to effect.
      - Researcher on the BMBF-funded ROCHADE project as CGE modeller and global trade
        data analyst.
    references: "Prof. Dr. Martin Petrick"

  - type: experience
    period: "Mar 2018 — Jan 2025"
    title: "Economist, short-term consultant"
    title-short: "Economist (STC)"
    place: "The World Bank · Poverty & Equity Global Practice"
    place-short: "The World Bank"
    in: [short, full]
    summary: "Microeconomic analysis of fiscal incidence, geospatial analysis and country-level capacity building, delivered largely as reusable software."
    description: |
      Microeconomic analysis of fiscal incidence, geospatial analysis and country-level
      capacity building, delivered largely as reusable software. R packages and Shiny
      applications let governments interrogate their own policy simulations.

      - [devCEQ](https://worldbank.github.io/devCEQ/) — fiscal microsimulation apps for
        Senegal, Côte d'Ivoire, Benin, Indonesia, Romania, Türkiye, El Salvador and
        Armenia, with capacity building in Indonesia and Georgia.
      - [devPTIpack](https://worldbank.github.io/devPTIpack) — Project Targeting Index
        tools across Africa and Asia.
      - Founded the [EU Poverty Mapping](https://github.com/wbEUPM) GitHub organisation
        and its initial guidelines; land-economics research at DEC on transparent land
        governance in Ukraine.
      - Shiny tools for fragility and conflict risk monitoring (Iraq), spatial poverty
        explorers (Latin America, Indonesia), rural diagnostics, and the lassopmm
        package.

  - type: experience
    period: "Oct 2017 — Dec 2019"
    title: "Researcher"
    place: "IAMO · Halle (Saale), Germany"
    in: [short, full]
    summary: "Land and labour relationships in agriculture, focusing on principal–agent problems and contractual relations in Ukraine."
    description: |
      Land and labour relationships in agriculture, focusing on principal–agent problems
      and contractual relations in Ukraine. Led the second wave of the IAMO Farm Survey
      in Kazakhstan and Central Asia — questionnaire design, pre-testing, interviewer
      training, and QA/QC over 600 collected responses.

  - type: experience
    period: "Sep 2014 — Jan 2018"
    title: "Trade Economist · Statistician"
    title-short: "Trade Economist / Statistician"
    place: "FAO of the United Nations · Rome"
    place-short: "FAO of the UN · Rome"
    in: [short, full]
    summary: "Policy briefs for the WTO 11th Ministerial, bilateral trade analysis, and the meat chapter of the *OECD-FAO Agricultural Outlook 2017–2026*."
    description: |
      Policy briefs for the WTO 11th Ministerial, bilateral trade analysis, and the meat
      chapter of the *OECD-FAO Agricultural Outlook 2017–2026*. Maintained the
      AGLINK-COSIMO country modules, and contributed the Import Surges and Price
      Depressions review and an R Shiny application for trade data exploration. Earlier,
