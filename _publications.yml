# The publication record — written down once, typeset by the {{< pubs >}} shortcode
# (_templates/pubs.lua) into web rows on publications.qmd / index.qmd and into
# reference-list bullets in the Typst CVs. _quarto.yml merges this file into every
# page's metadata via `metadata-files:`, so editing here updates site and PDFs together.
#
# Fields — only `type`, `year`, `title` and `authors` are required:
#
#   type          article | wip | working-paper | report | conference | thesis
#                 Each page selects by type: {{< pubs type=article >}}
#   year          used for sorting (newest first) and shown in the web row
#   title         full title; Markdown works, so subscripts are written `CO~2~`
#                 once and come out as <sub>2</sub> in HTML and CO#sub[2] in Typst
#   title-short   optional trimmed title, used only by {{< pubs titles=short >}}
#                 (cv-short.qmd); everywhere else the full title is used
#   authors       in order, formatted as they should appear; the name matching
#                 `author-me` below is highlighted automatically
#   journal       italicised, followed by `detail` (volume, issue, pages)
#   where         plain-text venue for anything without a journal — a working
#                 paper series, a conference, a thesis institution
#   summary       SHORT description — one line, sits on the citation line after the
#                 venue. Printed wherever the shortcode runs with show=summary
#                 (the default) or show=full
#   description   LONG description — a paragraph. Printed only where the shortcode
#                 runs with show=full: below the row on the web, as an indented
#                 continuation of the bullet in the CVs
#   page          a page on this site to send the reader to instead of the
#                 publisher — a note write-up, a project sub-page. Written
#                 site-root-relative as authored, e.g. notes/kazakhstan-land-reform.qmd
#   doi / url     `doi` becomes https://doi.org/…; `url` is used verbatim
#   selected      true puts the entry on the home page. Nothing else reads it: the
#                 two-page CV prints the whole `type: article` list, not a selection
#
# A row points at `page`, else `url`, else `doi` — most specific first, so adding a
# `page:` takes the row over from the DOI. An entry with none of the three is not a
# link at all: it renders as an inert row rather than one that goes nowhere.
#
# Which pages print how much:
#
#   publications.qmd    show=full     both descriptions
#   index.qmd           (default)     summary only
#   cv/cv-short.qmd     show=none     every peer-reviewed article, citations only
#   cv/cv-full.qmd      show=none     every entry, grouped into ### sections by type

