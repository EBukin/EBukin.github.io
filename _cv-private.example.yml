# TEMPLATE — COMMITTED TO A PUBLIC REPOSITORY. PLACEHOLDERS ONLY, NEVER REAL DETAILS.
#
# The contact details the website does not publish, for the CVs that are sent out
# rather than put online. The CVs do not read this file. They read _cv-private.yml,
# beside it at the project root: copy this file to that name and fill the copy in.
# .gitignore keeps _cv-private.yml out of the repository, so the real details never
# reach it; this template stays in the repository so a fresh clone knows the shape.
#
# Printed only by a CV whose header asks for them: {{< cv-header private=true >}}. The
# application CVs in cv/ do; cv-full.qmd and cv-short.qmd, the two that go on the site,
# do not. They come out as one line of their own, above the public links, in the order
# written here. CI has no copy of _cv-private.yml, so there the line is simply left out.
#
# Each entry is a `text:`, plus a `url:` when it should be a link — tel: for a phone,
# mailto: for an email. Add or drop entries freely: a postal address is one more.

cv-private:
  contact:
    - text: "City, Country"
    - text: "Nationality: Country"
    - text: "Born: Month YYYY"
    - text: "+00 000 000 0000"
      url: "tel:+000000000000"
    - text: "name@example.com"
      url: "mailto:name@example.com"

  # Referees, printed by {{< cv-referees >}} as a `## References` section — which the
  # application CVs call and the public ones must not. The names may also sit in the
  # public `references:` lines of _cv.yml; the emails belong here and nowhere else.
  referees:
    - name: "Referee Name"
      institution: "Institution"
      email: "referee@example.org"
