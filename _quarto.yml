  site-url: https://ebukin.github.io
  repo-url: https://github.com/EBukin/EBukin.github.io
  favicon: assets/logo.svg
  navbar:
    logo: assets/logo.svg
    title: false
    left:
      - text: "[Eddie Bukin]{.brand-name}"
